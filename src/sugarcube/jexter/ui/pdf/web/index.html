<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>PDF Inspector</title>
    <link rel="icon" type="image/svg+xml" href="/shared/jexter-mark.svg">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/dark.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Bloechle/qry-js@1.3.0/qry-ui.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@1.17.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/Bloechle/qry-js@1.3.0/qry.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/poppins@5/600.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/poppins@5/700.css">
    <link rel="stylesheet" href="pdfinspector.css">
</head>

<body class="qry-app">

<div id="dropzone" class="dropzone">
    <div class="dropzone-card"><i data-lucide="upload-cloud"></i><p><strong>Drop a PDF</strong> to open it</p></div>
</div>

<!-- ── Header: logo-menu · tabs · spacer · theme ── -->
<header class="jx-head">
    <sl-dropdown id="brand-menu" placement="bottom-start" distance="6" hoist>
        <span slot="trigger" class="jx-brand" role="button" tabindex="0">
            <img id="brand-logo" alt="" onerror="this.remove()">
            <span class="brandword">PDF Inspector</span>
        </span>
        <sl-menu id="main-menu">
            <sl-menu-item value="open"><i data-lucide="folder-open" slot="prefix"></i> Open…</sl-menu-item>
            <sl-menu-item value="save-image"><i data-lucide="image-down" slot="prefix"></i> Save page image…</sl-menu-item>
            <sl-divider></sl-divider>
            <sl-menu-item value="doc"><i data-lucide="file-text" slot="prefix"></i> Document info</sl-menu-item>
        </sl-menu>
    </sl-dropdown>

    <nav class="jx-tabs" role="tablist">
        <button class="jx-tab active" data-tab="page" role="tab"><i data-lucide="image"></i><span class="lbl">Viewer</span></button>
        <button class="jx-tab" data-tab="struct" role="tab"><i data-lucide="list-tree"></i><span class="lbl">Structure</span></button>
        <button class="jx-tab" data-tab="fonts" role="tab"><i data-lucide="type"></i><span class="lbl">Fonts</span></button>
        <button class="jx-tab" data-tab="resources" role="tab"><i data-lucide="images"></i><span class="lbl">Resources</span></button>
    </nav>

    <span class="sp"></span>
    <button id="btn-theme" class="qry-btn" title="Toggle light / dark"><i data-lucide="moon"></i></button>
    <input id="file" type="file" accept=".pdf,application/pdf" hidden>
</header>

<!-- ── Body: pages · splitter · viewer ── -->
<div class="jx-body" id="app">
    <aside class="jx-left" id="left">
        <div class="jx-left-head">Pages <span id="page-count" class="mono"></span></div>
        <div class="pagelist scroll" id="pagelist" role="list"></div>
    </aside>

    <div class="jx-splitter" id="split" role="separator" aria-orientation="vertical" title="Drag to resize"></div>

    <main class="viewer" id="viewer">
        <!-- Viewer — the page raster + zoom live in an isolated iframe (stage.html), like Jexter Lab -->
        <section class="pi-panel active" data-tab="page">
            <iframe id="stage-frame" src="stage.html" title="Page render"></iframe>
        </section>

        <!-- Structure — the one document COS tree (trailer → catalog → pages → page → …) -->
        <section class="pi-panel" data-tab="struct">
            <div class="pi-md">
                <div class="pi-tree-col scroll"><ul id="tree" class="jx-tree"></ul></div>
                <aside class="pi-detail" id="detail"></aside>
            </div>
        </section>

        <!-- Fonts — the document's fonts with glyph specimens (rendered from the OCD model) -->
        <section class="pi-panel" data-tab="fonts">
            <div class="fonts-wrap scroll" id="fonts-wrap">
                <div class="pi-empty">Open a document to inspect its fonts.</div>
            </div>
        </section>

        <!-- Resources — the document's image XObjects (thumbnail + metadata, click to enlarge) -->
        <section class="pi-panel" data-tab="resources">
            <div class="res-wrap scroll" id="res-wrap">
                <div class="pi-empty">Open a document to list its images.</div>
            </div>
        </section>
    </main>
</div>

<!-- ── Footer: toggle · status · render source · dims · zoom ── -->
<footer class="jx-foot">
    <button id="toggle-left" class="qry-btn" title="Toggle pages panel"><i data-lucide="panel-left"></i></button>
    <span id="status"><i data-lucide="scan-search"></i> Ready</span>
    <span class="sp"></span>
    <div id="render-src" class="render-src" role="group" aria-label="Render source"></div>
    <button id="cmp-toggle" class="srcbtn cmp-toggle" type="button" title="Compare PDFBox vs OCD — difference / fade / wipe"><i data-lucide="git-compare"></i><span>Compare</span></button>
    <div id="cmp-ctl" class="cmp-ctl" role="group" aria-label="Compare controls">
        <button data-mode="diff" class="cmp-mode is-on" type="button" title="Difference — identical pixels go black (Fid2 made visible)">Diff</button>
        <button data-mode="fade" class="cmp-mode" type="button" title="Opacity fade between the two renders">Fade</button>
        <button data-mode="wipe" class="cmp-mode" type="button" title="Wipe curtain — OCD on the left, PDFBox on the right">Wipe</button>
        <input id="cmp-slider" class="cmp-slider" type="range" min="0" max="100" value="50" title="Blend / wipe position">
    </div>
    <span id="page-dims" class="mono"></span>
    <div class="zoom">
        <button id="zoom-fit" class="qry-btn" title="Fit">Fit</button>
        <button id="zoom-out" class="qry-btn" title="Zoom out"><i data-lucide="minus"></i></button>
        <span id="zoom-pct" class="mono">100%</span>
        <button id="zoom-in" class="qry-btn" title="Zoom in"><i data-lucide="plus"></i></button>
    </div>
</footer>

<!-- ── Document drawer (metadata · pages · fonts) ── -->
<sl-drawer id="doc-drawer" label="Document" placement="end" class="doc-drawer">
    <div class="jx-section">Summary</div>
    <div id="doc-meta" class="jx-meta"><div class="jx-empty">No document.</div></div>
    <div class="jx-section">Metadata</div>
    <div id="doc-info-meta" class="jx-meta"><div class="jx-empty">&ndash;</div></div>
    <div class="jx-section">Pages</div>
    <div id="pages-table" class="jx-table-wrap"></div>
    <div class="jx-section">Fonts</div>
    <div id="fonts-table" class="jx-table-wrap"></div>
</sl-drawer>

<!-- ── Lightbox (zoom/pan an image resource) ── -->
<div id="lightbox" class="lightbox">
    <div class="lb-toolbar">
        <span id="lb-info" class="mono"></span>
        <span class="sp"></span>
        <button id="lb-out" class="qry-btn" title="Zoom out"><i data-lucide="minus"></i></button>
        <span id="lb-pct" class="mono">100%</span>
        <button id="lb-in" class="qry-btn" title="Zoom in"><i data-lucide="plus"></i></button>
        <button id="lb-fit" class="qry-btn" title="Fit">Fit</button>
        <button id="lb-close" class="qry-btn" title="Close (Esc)"><i data-lucide="x"></i></button>
    </div>
    <div class="lb-stage" id="lb-stage"><img id="lightbox-img" alt=""></div>
</div>

<script type="module" src="js/pdfinspector.js"></script>
</body>
</html>
