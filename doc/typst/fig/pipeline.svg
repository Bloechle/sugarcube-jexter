      <g transform="translate(566,109)"><rect width="196" height="36" rx="9" fill="#ffffff" stroke="#dfe1db" stroke-width="1.5"/><text x="16" y="24">SVG</text><text x="180" y="24" text-anchor="end" font-weight="400" font-size="11.5" fill="#9aa09a">vector, text stays text</text></g>
      <g transform="translate(566,156)"><rect width="196" height="36" rx="9" fill="#eef6df" stroke="#8ec63f" stroke-width="1.5"/><text x="16" y="24" fill="#2f5e12">Markdown</text><text x="180" y="24" text-anchor="end" font-weight="400" font-size="11.5" fill="#6a8a4a">structured text</text></g>
